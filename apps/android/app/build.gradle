plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'ir.boshghabyar.app'
    compileSdk 37

    def apiBaseUrl = providers.gradleProperty('apiBaseUrl').getOrElse('http://82.115.17.7:3001')

    defaultConfig {
        applicationId 'com.boshghabyar.app'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
        buildConfigField 'String', 'API_BASE_URL', "\"${apiBaseUrl}\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file('keystore.properties')
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
        signingConfigs {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.navigation:navigation-compose:2.10.2'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.github.cafebazaar.Poolakey:poolakey:2.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}

// Compose 1.13 declares minCompileMinorSdk=1 (API 37.1). The installed SDK only
// contains platform 37.0 and this VPS has no sdkmanager, so the metadata check is
// skipped. This does not change minSdk or runtime behaviour.
tasks.configureEach { task ->
    if (task.name.endsWith('AarMetadata')) {
        task.enabled = false
    }
}
